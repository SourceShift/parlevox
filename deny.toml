# cargo-deny configuration.
# Run locally with: cargo deny check

[graph]
# Analyse the whole workspace for every supported target.
targets = []

[advisories]
# A yanked dependency is allowed to build but is reported so it can be
# replaced deliberately rather than silently.
yanked = "warn"

[licenses]
# Apache-2.0 is this project's license; everything else is a dependency.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Duplicate major versions of these crates usually mean an unnecessary
# dependency was added.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
