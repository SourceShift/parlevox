[package]
name = "parlevox-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Session runtime: provider registry, bounded event queue, and the turn loop for parlevox."
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Opt-in OpenTelemetry turn spans. Off by default so the default build carries
# no OTel dependency edge and the event sequence is unchanged.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk"]

[dependencies]
parlevox-core = { version = "0.1.0", path = "../parlevox-core" }
parlevox-providers = { version = "0.1.0", path = "../parlevox-providers" }
futures-core.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
proptest.workspace = true
async-trait.workspace = true

[lints]
workspace = true
