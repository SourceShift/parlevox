[workspace]
resolver = "2"
members = [
    "crates/voicekit-core",
    "crates/voicekit-ipc",
    "crates/voicekit-plugin",
    "crates/voicekit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "signal"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
