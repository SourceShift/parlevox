[workspace]
resolver = "2"
members = [
    "crates/parlevox-core",
    "crates/parlevox-ipc",
    "crates/parlevox-providers",
    "crates/parlevox-runtime",
    "crates/parlevox-sidecar",
    "crates/parlevox-transport-ws",
    "crates/parlevox-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/SourceShift/parlevox"
homepage = "https://github.com/SourceShift/parlevox"
readme = "README.md"
keywords = ["voice", "agents", "speech", "tts", "realtime"]
categories = ["multimedia::audio", "asynchronous", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
anyhow = "1"
proptest = "1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "testing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
