[workspace]
resolver = "2"
members = [
    "crates/voicekit-core",
    "crates/voicekit-ipc",
    "crates/voicekit-providers",
    "crates/voicekit-runtime",
    "crates/voicekit-sidecar",
    "crates/voicekit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/SourceShift/voicekit"
homepage = "https://github.com/SourceShift/voicekit"
readme = "README.md"
keywords = ["voice", "agents", "speech", "tts", "realtime"]
categories = ["multimedia::audio", "asynchronous", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
anyhow = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
