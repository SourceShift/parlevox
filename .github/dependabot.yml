version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: "/sdks/python"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # The tag on dtolnay/rust-toolchain IS the toolchain version, not an
      # action version. Bumping @1.85.0 to @1.120.0 asks rustup for a
      # toolchain that does not exist and fails the MSRV job with a 404.
      # The MSRV is a deliberate choice; change it in Cargo.toml and here
      # together, never by an automated bump.
      - dependency-name: "dtolnay/rust-toolchain"
