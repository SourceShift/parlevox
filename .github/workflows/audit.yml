name: Security audit

on:
  schedule:
    # Weekly, off the hour to avoid the standing cron rush.
    - cron: "23 5 * * 1"
  push:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # audit-check publishes its result as a check run; without this the action
  # reports "Resource not accessible by integration" and the job fails even
  # when no vulnerability was found.
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
